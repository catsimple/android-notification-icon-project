name: Auto Sync Upstream

on:
  schedule:
    # 每天北京时间早上 8:00 (UTC 00:00) 自动检查并同步
    - cron: '0 0 * * *'
  workflow_dispatch: # 支持在 GitHub Actions 页面手动点击运行

# 关键：显式声明写权限，否则 git push 必定报 403 错误
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Git Identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync from Upstream with Ours Priority
        run: |
          # 1. 确保在本地 main 分支
          git checkout main || git checkout -b main origin/main

          # 2. 添加官方上游仓库（屏蔽标签干扰）
          git remote add upstream https://github.com/BetterAndroid/android-notification-icon-project.git || true
          git fetch upstream main --no-tags

          # 3. 尝试合并上游 main 分支
          if git merge upstream/main -m "chore: auto-sync updates from upstream"; then
            echo "Merge completed cleanly with no conflicts."
          else
            echo "Conflict detected! Applying 'ours-priority' resolution strategy..."

            # 获取所有发生冲突的文件列表
            conflicts=$(git diff --name-only --diff-filter=U)

            if [ -z "$conflicts" ]; then
              echo "Merge failed for unknown reasons. Aborting."
              git merge --abort
              exit 1
            fi

            while IFS= read -r file; do
              [ -z "$file" ] && continue

              if [[ "$file" == *"manifest.json" ]]; then
                echo "Smart merging JSON: $file"
                TARGET_FILE="$file" node << 'EOF'
                const fs = require('fs');
                const { execSync } = require('child_process');

                const targetFile = process.env.TARGET_FILE;

                let ours = null;
                let theirs = null;
                try {
                  ours = JSON.parse(execSync(`git show :2:"${targetFile}"`, { maxBuffer: 10 * 1024 * 1024 }).toString());
                } catch (e) {}

                try {
                  theirs = JSON.parse(execSync(`git show :3:"${targetFile}"`, { maxBuffer: 10 * 1024 * 1024 }).toString());
                } catch (e) {}

                let mergedResult;

                if (Array.isArray(ours) && Array.isArray(theirs)) {
                  // 动态检测包名字段（package / packageName / id / name）
                  const sample = (ours && ours[0]) || (theirs && theirs[0]) || {};
                  const keyProp = ['package', 'packageName', 'pkg', 'id', 'name'].find(k => k in sample) || 'package';

                  // 将我方的数据转成 Map，方便快速比对
                  const oursMap = new Map();
                  for (const item of ours) {
                    if (item && item[keyProp]) oursMap.set(item[keyProp], item);
                  }

                  const theirsKeys = new Set();
                  const list = [];

                  // 1. 严格按照上游原有的相对顺序排列，最小化未来的 git diff 冲突
                  for (const item of theirs) {
                    if (item && item[keyProp]) {
                      const k = item[keyProp];
                      theirsKeys.add(k);
                      if (oursMap.has(k)) {
                        // 发现两边都有的 App：强制用我方优化过的配置覆盖官方！
                        list.push(oursMap.get(k));
                      } else {
                        // 官方独有的新 App：收纳保留
                        list.push(item);
                      }
                    } else {
                      list.push(item);
                    }
                  }

                  // 2. 将我方独有的新增 App 追加到列表末尾
                  for (const item of ours) {
                    if (item && item[keyProp]) {
                      const k = item[keyProp];
                      if (!theirsKeys.has(k)) {
                        list.push(item);
                      }
                    }
                  }

                  mergedResult = list;
                } else if (typeof ours === 'object' && typeof theirs === 'object' && ours !== null && theirs !== null) {
                  // 对象/字典格式：上游打底，我方覆盖
                  mergedResult = { ...theirs, ...ours };
                } else {
                  mergedResult = ours || theirs;
                }

                fs.writeFileSync(targetFile, JSON.stringify(mergedResult, null, 2) + '\n');
EOF
                git add "$file"
              else
                echo "Resolving conflict by keeping our version for: $file"
                # 冲突的图片资源、文档等：如果我方有则保留我方；若我方已删除则保持删除
                if git checkout --ours -- "$file" 2>/dev/null; then
                  git add "$file"
                else
                  git rm -f "$file" 2>/dev/null || rm -f "$file"
                fi
              fi
            done <<< "$conflicts"

            # 4. 提交自动解决冲突后的合并
            git commit -m "chore: auto-sync from upstream with local priority overrides"
          fi

          # 5. 推送到远程 main 分支（使用 HEAD:main 规避游离分支风险）
          git push origin HEAD:main
